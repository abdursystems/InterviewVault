<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />

      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('iv_theme');
          if (stored === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAFAFA] text-zinc-900 dark:bg-[#09090B] dark:text-zinc-100 antialiased selection:bg-zinc-900 selection:text-white dark:selection:bg-zinc-100 dark:selection:text-zinc-900">

  </body>
